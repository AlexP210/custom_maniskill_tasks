[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "custom_maniskill_tasks"
version = "0.1.0"
description = "Central definitions of the ManiSkill tasks used across this project's agents"
authors = [
    { name = "Alex Pleava" }
]
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["custom_maniskill_tasks*"]

[tool.setuptools.package-data]
custom_maniskill_tasks = ["assets/fr3/*.urdf", "assets/fr3/meshes/**/*", "assets/fr3/LICENSE.*", "assets/fr3/NOTICE.*"]
